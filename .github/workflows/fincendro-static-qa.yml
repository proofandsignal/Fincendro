name: Fincendro Static QA
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - demo/**
      - qa/**
      - .github/workflows/fincendro-static-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run static QA
        run: node --test qa/static-qa.mjs
      - name: Run hermetic Chromium browser smoke
        run: node qa/browser-smoke.mjs
